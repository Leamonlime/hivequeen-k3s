# Shape of the application Secret. Placeholder values ONLY — never commit real ones.
# In practice, create this out-of-band so it never touches git, e.g.:
#
#   kubectl -n myapp create secret generic myapp-secrets \
#     --from-literal=api-key='...' \
#     --from-literal=bot-token='...'
#
# or seal it with sealed-secrets / SOPS before committing. This file exists only to
# document which keys the deployment expects.
apiVersion: v1
kind: Secret
metadata:
  name: myapp-secrets
  namespace: myapp
type: Opaque
stringData:
  api-key: "REPLACE_ME"
  bot-token: "REPLACE_ME"
